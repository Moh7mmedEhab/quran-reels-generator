services:
  quran-reels:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: 5000
      QURAN_REELS_OUTPUT_FOLDER: /data
    volumes:
      - quran-reels-data:/data
    restart: unless-stopped

volumes:
  quran-reels-data:
