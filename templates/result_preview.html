<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>{% if preview %}Result Preview{% else %}Preview Unavailable{% endif %}</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #111315; color: #f4f4f5; }
    body { min-height: 100dvh; }
    .stage { width: 100%; height: 100dvh; display: grid; place-items: center; padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left)); }
    video { display: block; max-width: calc(100vw - 2rem); max-height: calc(100dvh - 2rem); width: auto; height: auto; object-fit: contain; background: #000; box-shadow: 0 24px 80px #0009; }
    .chrome { position: fixed; z-index: 2; top: max(1rem, env(safe-area-inset-top)); right: max(1rem, env(safe-area-inset-right)); left: max(1rem, env(safe-area-inset-left)); display: flex; justify-content: flex-end; align-items: center; gap: .5rem; opacity: 0; transform: translateY(-5px); transition: opacity .18s ease, transform .18s ease; pointer-events: none; }
    body.chrome-visible .chrome, .chrome:focus-within { opacity: 1; transform: none; pointer-events: auto; }
    .chrome button, .chrome a { border: 1px solid #ffffff35; border-radius: .7rem; padding: .65rem .85rem; background: #17191bd9; color: #fff; font: inherit; font-size: .85rem; text-decoration: none; cursor: pointer; backdrop-filter: blur(12px); }
    .chrome button:hover, .chrome a:hover { background: #2a2d30; }
    .notice { position: fixed; z-index: 2; bottom: max(1rem, env(safe-area-inset-bottom)); left: 50%; max-width: calc(100vw - 2rem); transform: translate(-50%, 5px); padding: .55rem .8rem; border: 1px solid #ffffff1f; border-radius: .65rem; background: #17191bd9; color: #d4d4d8; font-size: .75rem; text-align: center; opacity: 0; transition: opacity .18s ease, transform .18s ease; pointer-events: none; backdrop-filter: blur(12px); }
    body.chrome-visible .notice, body.copied .notice { opacity: 1; transform: translate(-50%, 0); }
    .message { width: min(34rem, calc(100vw - 2rem)); padding: 2rem; border: 1px solid #ffffff20; border-radius: 1rem; background: #191b1e; box-shadow: 0 24px 80px #0008; text-align: center; }
    .message h1 { margin: 0; font-size: 1.2rem; }
    .message p { margin: .75rem 0 1.25rem; color: #c4c4ca; line-height: 1.5; }
    .message a { display: inline-block; border-radius: .7rem; padding: .7rem 1rem; background: #f4f4f5; color: #18181b; font-size: .9rem; font-weight: 650; text-decoration: none; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
  </style>
</head>
<body>
{% if preview %}
  <main class="stage" aria-label="Rendered video preview">
    <video controls playsinline preload="metadata" src="{{ video_url }}" aria-label="Configured Quran video preview"></video>
  </main>
  <nav class="chrome" aria-label="Preview actions">
    <button id="copy-preview-url" type="button">Copy Preview URL</button>
    <a href="{{ editor_url }}" id="exit-preview">Exit Preview</a>
  </nav>
  <p class="notice" id="preview-notice" role="status" aria-live="polite">Unlisted link: anyone with this URL can watch until {{ expires_at_label }}. Press Escape to return to the editor.</p>
  <script>
    const body = document.body;
    let hideChromeTimer;
    function revealChrome() {
      body.classList.add('chrome-visible');
      clearTimeout(hideChromeTimer);
      hideChromeTimer = setTimeout(() => {
        if (!document.querySelector('.chrome:focus-within')) body.classList.remove('chrome-visible');
      }, 3200);
    }
    ['pointermove', 'pointerdown', 'touchstart', 'keydown'].forEach(name => window.addEventListener(name, revealChrome, {passive: true}));
    revealChrome();
    window.addEventListener('keydown', event => {
      if (event.key === 'Escape') window.location.assign('{{ editor_url }}');
    });
    document.querySelector('#copy-preview-url').addEventListener('click', async () => {
      const notice = document.querySelector('#preview-notice');
      try {
        await navigator.clipboard.writeText(window.location.href);
        notice.textContent = 'Preview URL copied. Anyone with the link can watch until {{ expires_at_label }}.';
        body.classList.add('copied');
      } catch (_) {
        notice.textContent = 'Could not copy automatically. Copy the URL from your browser address bar.';
        body.classList.add('copied');
      }
      revealChrome();
      setTimeout(() => body.classList.remove('copied'), 3200);
    });
  </script>
{% else %}
  <main class="stage">
    <section class="message" role="alert">
      <h1>Preview unavailable</h1>
      <p>{{ error }}</p>
      <a href="{{ url_for('main.studio') }}">Back to editor</a>
    </section>
  </main>
{% endif %}
</body>
</html>
